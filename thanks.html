<title>お申込みを受け付けました｜株式会社タナカ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;background:#f6f9fd;color:#1d2a3d;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;border:1px solid #d9e4f1;border-radius:24px;padding:42px 34px;box-shadow:0 16px 42px rgba(20,64,123,.10);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#eaf7f2;color:#117458;font-size:30px;font-weight:900}h1{font-size:28px;margin:0 0 18px;color:#11253f}p{font-size:16px;line-height:1.9;margin:0 0 14px;color:#526a82}.notice{margin:24px 0;padding:16px;border-radius:14px;background:#f3f7fc;color:#334b63;font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:13px;background:#1e63f0;color:#fff;text-decoration:none;font-weight:800}.small{font-size:12px;color:#7a8ba0;margin-top:14px}@media(max-width:600px){.card{padding:32px 20px}h1{font-size:24px}}
</style>
</head>
<body>
<main class="card">
<div class="mark">✓</div>
<h1>お申込みを受け付けました</h1>
<p>ライフイズテック レッスン（中学）のお申込みありがとうございます。</p>
<div class="notice">お申込み内容を確認のうえ、2～3日中に株式会社タナカの担当者よりご連絡いたします。</div>
<p>入力いただいた返信用メールアドレスへ、受付確認の自動メールを送信します。</p>
<a class="btn" href="https://yoshi3710.github.io/lifeistech-tanaka/#apply">元のページへ戻る</a>
<div class="small">約6秒後に自動的に元のページへ戻ります。</div>
</main>
</body>
</html>
